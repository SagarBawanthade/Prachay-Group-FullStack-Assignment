services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: prachay-evms-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      - PORT=5001
      - CLIENT_URL=http://localhost:5173
    networks:
      - prachay-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: prachay-evms-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - prachay-network

networks:
  prachay-network:
    driver: bridge
